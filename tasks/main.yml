---
- name: Ensure HUGO installation directory exists
  ansible.builtin.file:
    path: '{{ hugo_install_dir }}'
    state: directory
    mode: '0755'

- name: Download HUGO
  ansible.builtin.get_url:
    url: '{{ hugo_repo_url }}/releases/download/v{{ hugo_version }}/{{ hugo_tarball }}'
    dest: '{{ hugo_download_dir }}/{{ hugo_tarball }}'
    checksum: sha256:{{ hugo_checksum }}

- name: Ensure HUGO binary is installed
  ansible.builtin.unarchive:
    src: '{{ hugo_download_dir }}/{{ hugo_tarball }}'
    dest: '{{ hugo_install_dir }}'
    remote_src: true
    include: hugo
    mode: '0755'
